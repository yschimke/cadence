name: Publish browser app and docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21.0.13+9.0.LTS
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platforms;android-37.0 build-tools;37.0.0
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Build production Wasm app
        # wasmoApp packages the same build for Wasmo (docs/wasmo-app.md); building it here checks
        # the packaging on every PR, while releases attach it.
        run: ./gradlew :shared:wasmJsBrowserDistribution :shared:wasmoApp --stacktrace
      - uses: actions/configure-pages@v6.0.0
      - name: Render existing documentation
        uses: actions/jekyll-build-pages@v1.0.13
        with:
          source: ./docs
          destination: ./_site
      - name: Add browser app
        run: |
          # Jekyll's Docker action writes root-owned output; stage a writable copy.
          mkdir -p _public
          cp -R _site/. _public/
          mkdir -p _public/app
          cp -R shared/build/dist/wasmJs/productionExecutable/. _public/app/
          test -f _public/index.html
          test -f _public/app/index.html
          test -f _public/app/cadence.js
          test -f _public/privacy/index.html
          touch _public/.nojekyll
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _public

  deploy:
    needs: build
    # Only main publishes; PRs and feature-branch dispatches build for validation.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
