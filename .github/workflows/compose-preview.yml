name: Compose Preview

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: compose-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apply:
    name: Render previews (baseline or PR comment, auto-selected)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - uses: yschimke/compose-ai-tools/.github/actions/apply@v0.19.39
        with:
          # Don't hard-gate the render on a preview that produces no PNG.
          #
          # `composePreviewRenderAll` renders every @Preview in the module; a
          # composable that throws under Robolectric (or a dialog/bottom-sheet
          # that composes into its own window and captures nothing) yields no
          # PNG. The action's default policy is `fail`, which turns that single
          # missing render into a hard Gradle error — the CLI then exits non-zero
          # without emitting an envelope, so the whole "Render previews" check
          # goes red even though the rest rendered fine. `warn` logs the stubborn
          # preview and keeps going, mirroring the design-catalog's
          # `allow-incomplete`. It also surfaces the offending preview names in
          # the preview-diff comment's "Render Failures" section, so a genuine
          # regression is still visible — just not a CI gate.
          missing-renders: warn
