name: Compose Preview

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to render and comment on (leave empty for baseline)'
        required: false
        default: ''

permissions: {}

concurrency:
  group: compose-preview-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || inputs.pr_number != '' }}

jobs:
  preview:
    permissions:
      contents: write
      pull-requests: write
    uses: yschimke/compose-ai-tools/.github/workflows/compose-preview-reusable.yml@2f91b8e3b158d70919e9926ce46f26fd348c1319
    with:
      pr-number: ${{ inputs.pr_number || '' }}
      variant: debug
      cli-version: catalog
      catalog-key: composePreviewPlugin
      missing-renders: warn
      skip: notifications
      timeout-minutes: 60
      java-version: '25.0.5+100000002.0.LTS'
      android-sdk-packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
