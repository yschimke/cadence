name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  assemble:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21.0.12+101.0.LTS

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;37.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Assemble debug APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check devcontainer configuration
        run: python3 .devcontainer/test_config.py

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21.0.12+101.0.LTS

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;37.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Run unit tests
        run: ./gradlew :composeApp:testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-reports
          path: |
            composeApp/build/reports/tests/
            composeApp/build/test-results/
          if-no-files-found: ignore

  lint:
    name: Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21.0.12+101.0.LTS

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;37.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Android lint
        run: ./gradlew :composeApp:lintDebug --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lint-reports
          path: |
            composeApp/build/reports/lint-results-*.html
            composeApp/build/reports/lint-results-*.xml
          if-no-files-found: ignore

  multiplatform:
    name: Desktop and browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21.0.12+101.0.LTS
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platforms;android-37.0 build-tools;37.0.0
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Install audio preparation test dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build desktop and browser; test shared storage
        run: ./gradlew :desktopApp:jvmJar :shared:desktopTest :shared:wasmJsBrowserDistribution --stacktrace
      - name: Test browser USB and filesystem adapter
        run: node --test tests/browser-platform.test.cjs
      - name: Test cloud metadata isolation and revision conflicts
        run: |
          npm install --prefix "$RUNNER_TEMP/cadence-cloud-tests" @electric-sql/pglite@0.5.11
          NODE_PATH="$RUNNER_TEMP/cadence-cloud-tests/node_modules" node tests/cloud-persistence.test.cjs
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cadence-web
          path: shared/build/dist/wasmJs/productionExecutable/

  desktop-installers:
    name: Desktop installers
    uses: ./.github/workflows/desktop-package.yml
