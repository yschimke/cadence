name: Desktop installers

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag; empty for a CI build
        type: string
        default: ''

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            format: deb
          - os: windows-latest
            platform: windows-x64
            format: msi
          - os: macos-15-intel
            platform: macos-x64
            format: dmg
          - os: macos-15
            platform: macos-arm64
            format: dmg
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21.0.13+9.0.LTS
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platforms;android-37.0 build-tools;37.0.0
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - name: Build installer with bundled Java runtime
        env:
          # Google OAuth client baked into the installer so end users don't need to create their own
          # Cloud project. Add CADENCE_GOOGLE_CLIENT_ID / CADENCE_GOOGLE_CLIENT_SECRET as repo
          # secrets to enable; while unset the Cross-device sync card falls back to the self-build
          # setup instructions.
          CADENCE_GOOGLE_CLIENT_ID: ${{ secrets.CADENCE_GOOGLE_CLIENT_ID }}
          CADENCE_GOOGLE_CLIENT_SECRET: ${{ secrets.CADENCE_GOOGLE_CLIENT_SECRET }}
        run: |
          args=()
          if [[ -n "$RELEASE_TAG" ]]; then
            args+=("-PdesktopVersion=${RELEASE_TAG#v}")
          fi
          if [[ -n "$CADENCE_GOOGLE_CLIENT_ID" ]]; then
            args+=("-PcadenceGoogleClientId=$CADENCE_GOOGLE_CLIENT_ID")
          fi
          if [[ -n "$CADENCE_GOOGLE_CLIENT_SECRET" ]]; then
            args+=("-PcadenceGoogleClientSecret=$CADENCE_GOOGLE_CLIENT_SECRET")
          fi
          ./gradlew :desktopApp:packageDistributionForCurrentOS "${args[@]}" --stacktrace
      - name: Show packaging diagnostics
        if: failure()
        run: |
          find desktopApp/build/compose -type f \( -name '*.txt' -o -name '*.log' \) -print -exec cat {} \;
      - name: Stage installer
        env:
          PLATFORM: ${{ matrix.platform }}
          FORMAT: ${{ matrix.format }}
        run: python3 scripts/stage-desktop-release.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: desktop-${{ matrix.platform }}
          path: _desktop-release/
          if-no-files-found: error
