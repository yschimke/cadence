name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.1)'
        required: true
        type: string
      publish_play:
        description: 'Publish bundle and listing to Play internal testing'
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.1)'
        required: true
        type: string
      publish_play:
        description: 'Publish bundle and listing to Play internal testing'
        type: boolean
        default: true
      publish_release:
        description: 'Attach assets to the GitHub release'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Signing & Play upload:
#   Publishing validates required secrets; build-only dispatches work without them.
#     SIGNING_KEYSTORE              - base64 of the upload keystore (.jks)
#     CADENCE_KEYSTORE_PASSWORD     - keystore password
#     CADENCE_KEY_ALIAS             - key alias inside the keystore
#     CADENCE_KEY_PASSWORD          - key password
#     PLAY_SERVICE_ACCOUNT_JSON     - service account JSON contents; presence
#                                     also gates the Play upload step
# GitHub Packages publishing is wired in the root build.gradle.kts:
#   any subproject that applies the `maven-publish` plugin and declares
#   publications will be uploaded by the `publishLibraries` step. Today no
#   module does that — once a library module is extracted, no workflow
#   change is needed.
# GOOGLE_SERVICES_JSON: base64 of composeApp/google-services.json (required for Play).
# PLAY_PUBLISH_LISTING=false disables listing uploads; enabled by default.
jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    env:
      TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
      HAS_SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE != '' }}
      HAS_PLAY_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      HAS_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
      PUBLISH_PLAY: ${{ format('{0}', inputs.publish_play) != 'false' }}
      PUBLISH_LISTING: ${{ vars.PLAY_PUBLISH_LISTING != 'false' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21.0.13+9.0.LTS

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;37.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Check publishing configuration
        if: env.PUBLISH_PLAY == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.CADENCE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CADENCE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CADENCE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for flag in HAS_SIGNING_KEYSTORE HAS_PLAY_CREDENTIALS HAS_GOOGLE_SERVICES; do
            if [[ "${!flag}" != "true" ]]; then
              echo "::error::Missing publishing configuration: $flag (see docs/play-publishing.md)"
              missing=1
            fi
          done
          for key in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing signing configuration: $key"
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure Firebase Analytics and Crashlytics
        if: env.HAS_GOOGLE_SERVICES == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > composeApp/google-services.json

      - name: Decode signing keystore
        if: env.HAS_SIGNING_KEYSTORE == 'true'
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          set -euo pipefail
          keystore="${RUNNER_TEMP}/upload.jks"
          printf '%s' "$SIGNING_KEYSTORE" | base64 -d > "$keystore"
          echo "CADENCE_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Assemble release
        env:
          CADENCE_KEYSTORE_PASSWORD: ${{ secrets.CADENCE_KEYSTORE_PASSWORD }}
          CADENCE_KEY_ALIAS: ${{ secrets.CADENCE_KEY_ALIAS }}
          CADENCE_KEY_PASSWORD: ${{ secrets.CADENCE_KEY_PASSWORD }}
          CADENCE_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.CADENCE_GOOGLE_ANDROID_CLIENT_ID }}
        run: |
          set -euo pipefail
          args=(:composeApp:assembleRelease :composeApp:bundleRelease :shared:wasmoApp --stacktrace)
          if [[ -n "${CADENCE_GOOGLE_ANDROID_CLIENT_ID:-}" ]]; then
            args+=("-PcadenceGoogleAndroidClientId=$CADENCE_GOOGLE_ANDROID_CLIENT_ID")
          fi
          ./gradlew "${args[@]}"

      - name: Publish library artifacts to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publishLibraries --stacktrace

      - name: Publish to Play (internal track)
        if: env.PUBLISH_PLAY == 'true'
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          CADENCE_KEYSTORE_PASSWORD: ${{ secrets.CADENCE_KEYSTORE_PASSWORD }}
          CADENCE_KEY_ALIAS: ${{ secrets.CADENCE_KEY_ALIAS }}
          CADENCE_KEY_PASSWORD: ${{ secrets.CADENCE_KEY_PASSWORD }}
        run: ./gradlew :composeApp:publishReleaseBundle --stacktrace

      - name: Publish store listing to Play
        if: env.PUBLISH_PLAY == 'true' && env.PUBLISH_LISTING == 'true'
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          CADENCE_KEYSTORE_PASSWORD: ${{ secrets.CADENCE_KEYSTORE_PASSWORD }}
          CADENCE_KEY_ALIAS: ${{ secrets.CADENCE_KEY_ALIAS }}
          CADENCE_KEY_PASSWORD: ${{ secrets.CADENCE_KEY_PASSWORD }}
        run: ./gradlew :composeApp:publishReleaseListing --stacktrace

      - name: Publishing summary
        if: always()
        run: |
          {
            echo "## Android publishing"
            echo "- Tag: $TAG_NAME"
            echo "- Internal rollout requested: $PUBLISH_PLAY"
            echo "- Listing enabled: $PUBLISH_LISTING"
            echo "- Signing configured: $HAS_SIGNING_KEYSTORE"
            echo "- Play credentials configured: $HAS_PLAY_CREDENTIALS"
            echo "- Firebase configured: $HAS_GOOGLE_SERVICES"
            echo "- Job status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage release assets
        id: stage
        run: |
          set -euo pipefail
          mkdir -p _release
          version="${TAG_NAME#v}"
          shopt -s nullglob
          # APKs land as composeApp-release.apk (signed) or
          # composeApp-release-unsigned.apk (no signingConfig). Either way
          # we publish it as cadence-<version>.apk; the suffix encodes signing
          # state for transparency.
          for f in composeApp/build/outputs/apk/release/*.apk; do
            name=$(basename "$f" .apk)
            suffix=""
            case "$name" in
              *-unsigned) suffix="-unsigned" ;;
            esac
            cp "$f" "_release/cadence-${version}${suffix}.apk"
          done
          for f in composeApp/build/outputs/bundle/release/*.aab; do
            cp "$f" "_release/cadence-${version}.aab"
          done
          # The browser build as an installable Wasmo app. Unversioned so
          # releases/latest/download/cadence.wasmo is a stable install URL;
          # see docs/wasmo-app.md.
          cp shared/build/wasmo/cadence.wasmo _release/cadence.wasmo
          ls -la _release/
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Attach assets to GitHub release
        if: github.event_name == 'push' || inputs.publish_release == true
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: |
            _release/*.apk
            _release/*.aab
            _release/cadence.wasmo
          fail_on_unmatched_files: true

      - name: Upload workflow artifact
        if: github.event_name != 'push' && inputs.publish_release != true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ steps.stage.outputs.version }}
          path: _release/

  desktop:
    name: Build desktop installers
    uses: ./.github/workflows/desktop-package.yml
    with:
      tag: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

  publish-desktop:
    name: Attach desktop installers
    needs: [desktop, release]
    # Manual dispatch builds artifacts without modifying an existing release.
    if: github.event_name == 'push' || inputs.publish_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: _desktop-release
      - name: Attach to the release created by release-please
        run: gh release upload "$TAG_NAME" _desktop-release/* --clobber
