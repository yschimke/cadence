name: Design Artifacts

# Render the Cadence design catalog (:composeApp @Preview sticker sheet) and
# publish its importable bundle (catalog.json + DTCG tokens + Figma variables +
# PNGs) to a clean `design-artifacts/cadence` branch. The public preview server
# (preview.coo.ee) fetches that branch and serves it at /cadence/.
#
# Pipeline mirrors meshcore-mobile's design-artifacts job:
#   compose-preview bundle pack  ->  @design-parity/catalog-export driver
#   (from a compose-ai-tools checkout)  ->  force-push out/ to the branch.

on:
  # Weekly, so the published sticker sheet tracks the catalog as it evolves.
  # Staggered off meshcore/HA (06:00) to avoid clustering.
  schedule:
    - cron: '13 6 * * 1' # Mondays 06:13 UTC
  # Republish as soon as something that changes the rendered output lands on
  # main, instead of serving stale artifacts until Monday. The paths are the
  # render's inputs: the compose-ai-tools action pins (this file and
  # compose-preview.yml carry them — a compose-ai-tools release changes the
  # renderer, so it changes the output), the Gradle dependency manifests (any
  # dependency the catalog renders against does the same), the spec that
  # decides what's in the sheet, and this file itself.
  #
  # This fires for merges made with an app token — Renovate merges its own
  # compose-ai-tools PRs (see renovate.json) and those DO raise `push`. It does
  # NOT fire for GITHUB_TOKEN merges, which is why scheduled-merge.yml still
  # dispatches this workflow explicitly after the PRs it merges.
  push:
    branches:
      - main
    paths:
      # Dependency manifests. The version catalog holds most pins, but
      # Renovate's gradle manager also rewrites coords declared inline in a
      # module build file — this repo hard-codes `com.squareup.okio:okio` in
      # both composeApp/ and shared/ — and its gradle-wrapper manager rewrites
      # gradle-wrapper.properties. Globbed rather than enumerating the modules
      # the render actually pulls in: that list goes stale the moment a module
      # is added, and the failure mode of missing one is a silently stale
      # delivery branch, which is the exact bug this trigger exists to fix. An
      # over-trigger just costs one spare render.
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/gradle-wrapper.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '**/build.gradle.kts'
      - 'catalog.spec.json'
      - '.github/workflows/design-artifacts.yml'
      - '.github/workflows/compose-preview.yml'
  workflow_dispatch:
    inputs:
      allow_incomplete:
        description: 'Publish even if some catalog previews fail to render or lack semantics (use for the first run while tuning the spec).'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: design-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: cadence
    # Don't run on forks — the publish step pushes a branch into this repo.
    if: ${{ github.repository == 'yschimke/cadence' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # JDK 21 + Android SDK + Gradle, mirroring compose-preview.yml (the
      # :composeApp Robolectric render needs the Android SDK).
      - name: Set up JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      # Install the compose-preview CLI. Deliberately no `version:` — the action
      # defaults to `latest`, which is the only self-maintaining option here.
      #
      # It used to say version: "0.17.19", claiming lockstep with the plugin
      # applied by compose-preview.yml. That claim rotted silently: Renovate
      # tracks the action REF (bumped to v0.19.18 above, in the compose-ai-tools
      # group) but cannot see a literal string in a workflow input, so the
      # renderer producing the published catalog sat ~31 releases behind the
      # plugin the render path actually applies — the CLI/plugin skew
      # docs/RENDERER_COMPATIBILITY.md warns about, arrived at by accident.
      #
      # `latest` is safe because :composeApp does not apply the plugin from its
      # build (there is no ee.schimke.composeai coordinate in
      # gradle/libs.versions.toml at all) — the CLI injects it via --init-script,
      # so it always carries a matching plugin and cannot skew against a stale
      # pin. Same reasoning as homeassistant-remotecompose's `cli-version:
      # latest`. If a pin is ever needed again, add the version to the version
      # catalog and use version: catalog, so Renovate can see it.
      - uses: yschimke/compose-ai-tools/.github/actions/install@v1.10.0
        with:
          github-token: ${{ github.token }}

      # The export driver + its render helpers live in compose-ai-tools; check it
      # out (public repo) so we can run scripts/design-artifacts/.
      - uses: actions/checkout@v7.0.1
        with:
          repository: yschimke/compose-ai-tools
          ref: main
          path: compose-ai-tools
          persist-credentials: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0
      - name: Install export engine (pinned npm packages)
        working-directory: compose-ai-tools/scripts/design-artifacts
        run: npm ci

      # Render the catalog module into a portable bundle with semantics (a11y
      # greenlines + layout tree -> tokens/wireframes in the exported catalog).
      - name: Render catalog bundle
        run: |
          set -euo pipefail
          compose-preview bundle pack --module :composeApp --with-semantics \
            -o "$GITHUB_WORKSPACE/cadence-bundle.png"

      # Join the render to catalog.spec.json and write the importable bundle.
      #
      # `--publish-live-bundle` carries the executable render bundle onto the delivery
      # branch under bundle/ and records liveBundle in catalog.json, so the preview
      # server (preview.coo.ee) stands a render daemon up from it and re-renders the
      # previews live (device / theme / knob controls) instead of replaying baked PNGs.
      # Without it the delivery branch is baked-PNG only (ServeDegradation
      # `catalog-baked-only`), which is why /cadence/ served snapshots. :composeApp is
      # an Android/Robolectric render — the same backend the server already re-renders
      # for compose-ai-tools' wear-m3. The step's internal `bundle externalize` is
      # best-effort (try/caught in the driver), so an older CLI simply publishes a
      # self-contained bundle rather than failing.
      - name: Generate importable catalog
        run: |
          set -euo pipefail
          node compose-ai-tools/scripts/design-artifacts/generate-design-catalog.mjs \
            --spec catalog.spec.json \
            --renders "$GITHUB_WORKSPACE/cadence-bundle.png" \
            --out "$GITHUB_WORKSPACE/out" \
            --renderer "$(compose-preview --version | head -1)" \
            --publish-live-bundle \
            --source-repo "${GITHUB_REPOSITORY}" \
            --source-ref main \
            --source-module :composeApp \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.allow_incomplete) && '--allow-incomplete' || '' }}

      - name: Publish to design-artifacts/cadence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/out"
          git init -q
          git checkout -q -b design-artifacts/cadence
          # Generated delivery branch — attributed to the repo owner, not a bot.
          git config user.name 'Yuri Schimke'
          git config user.email 'yuri@schimke.ee'
          git add -A
          git commit -q -m "chore(design-artifacts): regenerate cadence catalog ($(date -u +%F))"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/design-artifacts/cadence"
