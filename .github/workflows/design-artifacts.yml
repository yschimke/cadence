name: Design Artifacts

# Render the Cadence design catalog (:composeApp @Preview sticker sheet) and
# publish its importable bundle (catalog.json + DTCG tokens + Figma variables +
# PNGs) to the `design-artifacts/cadence` branch. The public preview server
# (preview.coo.ee) fetches that branch and serves it at /cadence/.
#
# The pipeline itself lives in compose-ai-tools as a reusable workflow — the
# same one homeassistant-remotecompose and compose-ai-tools' own catalogs call —
# so this file only supplies the catalog's parameters. It replaces the inline
# copy of the job we used to carry, which checked out compose-ai-tools@main and
# ran `npm ci` in scripts/design-artifacts; that broke once the export engine
# moved behind the reusable workflow's pinned driver (compose-ai-tools#5737) and
# the directory stopped shipping a package.json. See
# yschimke/compose-ai-tools/.github/workflows/design-artifacts-reusable.yml.
#
# The reusable workflow is pinned by commit SHA; Renovate's compose-ai-tools
# group (renovate.json) bumps the digest alongside the action pins.

on:
  # Weekly, so the published sticker sheet tracks the catalog as it evolves.
  # Staggered off meshcore/HA (06:00) to avoid clustering.
  schedule:
    - cron: '13 6 * * 1' # Mondays 06:13 UTC
  # Republish as soon as something that changes the rendered output lands on
  # main, instead of serving stale artifacts until Monday. The paths are the
  # render's inputs: the compose-ai-tools action pins (this file and
  # compose-preview.yml carry them — a compose-ai-tools release changes the
  # renderer, so it changes the output), the Gradle dependency manifests (any
  # dependency the catalog renders against does the same), the spec that
  # decides what's in the sheet, and this file itself.
  #
  # This fires for merges made with an app token — Renovate merges its own
  # compose-ai-tools PRs (see renovate.json) and those DO raise `push`. It does
  # NOT fire for GITHUB_TOKEN merges, which is why scheduled-merge.yml still
  # dispatches this workflow explicitly after the PRs it merges.
  push:
    branches:
      - main
    paths:
      # Dependency manifests. The version catalog holds most pins, but
      # Renovate's gradle manager also rewrites coords declared inline in a
      # module build file — this repo hard-codes `com.squareup.okio:okio` in
      # both composeApp/ and shared/ — and its gradle-wrapper manager rewrites
      # gradle-wrapper.properties. Globbed rather than enumerating the modules
      # the render actually pulls in: that list goes stale the moment a module
      # is added, and the failure mode of missing one is a silently stale
      # delivery branch, which is the exact bug this trigger exists to fix. An
      # over-trigger just costs one spare render.
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/gradle-wrapper.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '**/build.gradle.kts'
      - 'catalog.spec.json'
      # The preview sources themselves. Without these a feature PR (the swim
      # visuals, the launcher and Wear widgets) only reached preview.coo.ee on
      # the next Monday cron or an unrelated dependency bump.
      - 'composeApp/src/**'
      - 'swimUi/src/**'
      - 'wearApp/src/**'
      - 'shared/src/**'
      - '.github/workflows/design-artifacts.yml'
      - '.github/workflows/compose-preview.yml'
  # No `allow_incomplete` input: the job passes `allow-incomplete: true`
  # unconditionally, so a dispatch toggle would do nothing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: cadence
    # Don't run on forks — the publish job pushes a branch into this repo.
    if: ${{ github.repository == 'yschimke/cadence' }}
    permissions:
      # Widened here (workflow default is read-only) for the delivery-branch push.
      # The reusable workflow keeps every job that runs this repo's Gradle on
      # `contents: read`; only its separate publish job uses the write grant.
      contents: write
    uses: yschimke/compose-ai-tools/.github/workflows/design-artifacts-reusable.yml@36219e4d4395fcc4fd866f2e148b0cc41d03c7e2
    with:
      system: cadence
      ref: ${{ github.sha }}
      # Only main publishes; a manual dispatch from another branch renders without pushing.
      publish: ${{ github.ref == 'refs/heads/main' }}
      spec: catalog.spec.json
      # Every preview-enabled module, not just :composeApp: the Wear widgets
      # live in :wearApp and the swim visuals (launcher + Wear) in :swimUi, and
      # with `module: ':composeApp'` none of them reached preview.coo.ee.
      # catalog.spec.json's `"module": "composeApp"` stays the primary that the
      # authored groups resolve against; the other modules get their own
      # sections from discovery. Same setup as meshcore-mobile.
      modules: all
      # Pinned through the version catalog's `composePreviewPlugin` key (the
      # action's default catalog-key), as meshcore-mobile and
      # homeassistant-remotecompose do. `latest` picked the newest CLI release
      # and then waited 300s for a Gradle plugin of the same version, which
      # several releases (2.76.0-2.78.0, 2.79.1, 2.79.2) never published to
      # Maven Central. Every run from 28 Oct onward failed in "Install
      # compose-preview CLI", so preview.coo.ee/cadence/ stopped updating. Bump
      # the key only to a version whose plugin resolves on Central.
      # Render the debug variant explicitly. AGP 9.5 turns unit tests off for release
      # variants, and Compose Preview packages Android resources through the variant's
      # unit-test APK, so a release render fails before it starts (compose-ai-tools #6382).
      variant: debug
      cli-version: catalog
      # Carry the executable render bundle onto the delivery branch under bundle/
      # and record liveBundle in catalog.json, so preview.coo.ee re-renders the
      # previews live (device / theme / knob controls) instead of serving baked
      # PNGs only (`catalog-baked-only`). :composeApp is an Android/Robolectric render.
      publish-live-bundle: true
      # Keep pure editable SVGs transient: produced for catalog generation and cover
      # cropping, then re-produced by the live daemon on request, rather than
      # churning hundreds of coordinate-derived files on the branch every publish
      # (ported from yschimke/meshcore-mobile#461).
      defer-figma-svg: true
      split-per-preview: false
      # Widget renders draw a Remote Compose document through a player View and
      # carry no semantics; catalog.spec.json exempts them by name. Anything the
      # exemptions miss is reported (run log + job summary) rather than blocking
      # the publish: a catalog missing one sticker beats a stale one. This is
      # what meshcore-mobile settled on after its widget previews stranded the
      # catalog behind the completeness gate.
      allow-incomplete: true
      # Generated delivery branch — attributed to the repo owner, not a bot.
      commit-user-name: 'Yuri Schimke'
      commit-user-email: 'yuri@schimke.ee'
      timeout-minutes: 60
