name: Baseline Profiles

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Revision to profile
        type: string
        required: false

permissions:
  contents: read

jobs:
  generate:
    name: Generate ${{ matrix.name }} profile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mobile
            app: composeApp
            target: google_apis
            profile: pixel_6
          - name: wear
            app: wearApp
            target: android-wear
            profile: wearos_large_round
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21.0.13+9.0.LTS

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;37.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Generate profile on emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          APP_MODULE: ${{ matrix.app }}
        with:
          api-level: 34
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./scripts/generate-baseline-profile.sh "$APP_MODULE"

      - name: Upload generated profile
        uses: actions/upload-artifact@v7.0.2
        with:
          name: baseline-profile-${{ matrix.name }}
          path: ${{ matrix.app }}/src/release/generated/baselineProfiles/
          if-no-files-found: error

      - name: Upload instrumentation results
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: baseline-profile-${{ matrix.name }}-test-results
          path: |
            *BaselineProfile/build/reports/androidTests/
            *BaselineProfile/build/outputs/androidTest-results/
          if-no-files-found: ignore
