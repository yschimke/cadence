[versions]
# compose-preview CLI + Gradle plugin used by design-artifacts.yml (`cli-version: catalog`).
# Not referenced by a build: the CLI injects the plugin. Keep it on a version
# whose plugin is on Maven Central.
composePreviewPlugin = "2.79.0"
# `preview-annotations` ships from yschimke/compose-preview-daemon on its own 3.x release line;
# partial releases publish only changed modules and update `compose-preview-daemon-bom`.
composePreviewDaemon = "3.27.7"
firebase-bom = "35.2.0"
benchmark = "1.5.0"
profileinstaller = "1.4.1"
agp = "9.5.1"
android-compileSdk = "37"
android-minSdk = "34"
android-targetSdk = "36"
appauth = "0.11.1"
okhttp = "5.5.1"
androidx-activityCompose = "1.13.0"
androidx-appcompat = "1.8.0"
androidx-constraintlayout = "2.2.2"
androidx-core-ktx = "1.19.1"
androidx-espresso-core = "3.7.0"
androidx-lifecycle = "2.11.0"
androidx-material = "1.14.0"
androidx-test-junit = "1.3.0"
androidx-ui-google-fonts = "1.12.1"
# Android-only: MaterialExpressiveTheme and MotionScheme are public from 1.5.0. Compose Multiplatform
# material3 (composeMaterial3) still resolves 1.4.0 on Android, which keeps them internal.
androidx-compose-material3 = "1.5.0-rc01"
androidx-work = "2.12.0"
bonsaiCore = "1.2.0"
compose-multiplatform = "1.12.2"
datastore = "1.3.0"
appstate-transform = "1.0.0-alpha02"
documentfile = "1.1.0"
junit = "4.13.2"
kotlin = "2.4.21"
kotlinxCoroutines = "1.11.0"
kotlinxSerializationJson = "1.13.0"
ktfmt = "0.28.0"
ktorClientCore = "3.6.1"
coil = "3.6.3"
materialIconsCore = "1.7.3"
metro = "1.5.2"
media3 = "1.11.1"
horologist = "0.8.4-alpha"
composeMaterial3 = "1.9.0"
okio = "3.18.2"
usb4java = "1.3.0"
navigationCompose = "2.10.0"
playPublisher = "4.1.2"
# rc-players: the podcast widget is a Remote Compose launcher widget captured on the device. Its
# artifacts take their versions from rc-players-bom. Since 3.0 its widget helpers for AndroidX's
# creation API, which the launcher and Glance Wear hosts take, are rc-widget-creation-androidx
# (ee.schimke.composeai.rcwidget.creation.androidx), brought by rc-widget-launcher.
rcPlayers = "3.0.0"
# Livery: the headphone widget's templates, baked into the APK and played on the launcher.
livery = "0.10.0"
robolectric = "4.17"
robolectric-sdk35 = "15-robolectric-13954326-i7"
runner = "1.7.0"
tapmoc = "0.5.0"
wire = "7.2.0"
wearCompose = "1.7.1"
wearWidgets = "1.0.0-alpha22"
composeRemote = "1.0.0-alpha23"
wearComposeRemote = "1.0.0-alpha15"
playAppUpdate = "2.1.0"
playServicesWearable = "20.0.1"

